[package]
name = "sahyadri-plonky3"
version = "1.1.0"
edition = "2021"
description = "Plonky3 STARK ZKP — compress 10K Dilithium3 sigs (33MB) into one ~30KB proof, verify in ~1ms"
authors = ["Sahyadri Labs <dev@sahyadri.io>"]
license = "MIT"

[dependencies]
p3-air = "0.8.0"
p3-uni-stark = "0.8.0"
p3-baby-bear = "0.8.0"
p3-goldilocks = "0.8.0"
p3-field = "0.8.0"
p3-matrix = "0.8.0"
p3-fri = "0.8.0"
p3-keccak = "0.8.0"
p3-commit = "0.8.0"
p3-batch-stark = "0.8.0"
p3-challenger = "0.8.0"
p3-lookup = "0.8.0"
p3-merkle-tree = "0.8.0"
p3-dft = "0.8.0"
p3-poseidon2-air = "0.8.0"
p3-circuit-prover = { git = "https://github.com/Plonky3/Plonky3-recursion" }
p3-recursion = { git = "https://github.com/Plonky3/Plonky3-recursion" }
p3-symmetric = "0.8.0"
p3-util = "0.8.0"
p3-circuit = { git = "https://github.com/Plonky3/Plonky3-recursion" }
p3-poseidon2-circuit-air = { git = "https://github.com/Plonky3/Plonky3-recursion" }
sahyadri-dilithium = { path = "../dilithium" }
dilithium-rs = { workspace = true }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
bincode = "1"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
rand = "0.10.3"
rayon = "1.12"
p3-maybe-rayon = "0.8.0"
sahyadri-smt = { path = "../smt" }
p3-poseidon2 = "0.8.0"

[dev-dependencies]
bincode = "1"
p3-lookup = "0.8.0"

[features]
default = ["std"]
std = []
parallel = ["p3-maybe-rayon/parallel", "p3-recursion/parallel"]
